name: Test finite spot backfill

on:
  push:
    paths:
      - 'deploy/spot-backfill/**'
      - '.github/workflows/spot-backfill.yml'
  pull_request:
    paths:
      - 'deploy/spot-backfill/**'
      - '.github/workflows/spot-backfill.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: backfill-test-only
          POSTGRES_DB: backfill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d backfill_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r deploy/spot-backfill/requirements.txt
      - run: python -m unittest discover -s deploy/spot-backfill/tests -v
        env:
          PLANFIX_BACKFILL_TEST_DB: '{"host":"127.0.0.1","port":5432,"dbname":"backfill_test","user":"postgres","password":"backfill-test-only"}'
      - run: bash -n deploy/spot-backfill/install.sh
