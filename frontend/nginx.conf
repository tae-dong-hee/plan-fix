server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Allow multipart overhead and the backend's existing 15MB image uploads.
        client_max_body_size 16m;
        # Allow the bounded photo-to-story model request to finish before proxy timeout.
        proxy_read_timeout 95s;
        proxy_pass https://planfix-backend-148201851366.asia-northeast3.run.app;
        proxy_ssl_server_name on;
        proxy_set_header Host planfix-backend-148201851366.asia-northeast3.run.app;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /deploy-version.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
