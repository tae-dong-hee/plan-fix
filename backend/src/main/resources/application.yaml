spring:
  application:
    name: plan-fix

  mvc:
    async:
      # 수집 API는 외부 API를 수천 번 호출하므로 관대하게 잡는다 (컨트롤러의 WebAsyncTask 타임아웃과 맞춤)
      request-timeout: 30m

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false


server:
  tomcat:
    connection-timeout: 20s

security:
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-key-change-me-please}
    access-token-validity-seconds: ${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:1209600}

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  cookie:
    secure: ${COOKIE_SECURE:false}
    same-site: ${COOKIE_SAME_SITE:Lax}

oauth:
  kakao:
    authorize-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}
    # 카카오 디벨로퍼스 > 카카오 로그인 > 동의항목에 켜둔 항목과 일치해야 한다.
    scope: ${KAKAO_SCOPE:profile_nickname,account_email}
    # 비밀값. 로컬은 application-secret.yml, 운영은 실제 환경변수로 주입한다.
    # 기본값을 비워 둬서 값이 없어도 앱은 뜨고 카카오 로그인만 실패한다.
    client-id: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model-name: ${GEMINI_MODEL:gemini-3.5-flash-lite}

# 자동차 길찾기에 사용하도록 지정한 REST 키.
# JavaScript 지도 키는 길찾기 인증에 사용할 수 없다.
routing:
  kakao:
    api-key: ${KAKAO_MOBILITY_REST_API_KEY:}

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:planfix-bucket}
    region: ${AWS_REGION:ap-northeast-2}
    access-key: ${AWS_ACCESS_KEY:}
    secret-key: ${AWS_SECRET_KEY:}

springdoc:
  swagger-ui:
    # Swagger UI가 요청에 인증 쿠키(access_token)를 함께 실어 보내게 한다.
    # 끄면 로그인이 되어 있어도 Swagger에서 보낸 요청이 비인증으로 도착해,
    # /api/v1/admin/** 같은 인가 경로에서 Http403ForbiddenEntryPoint가 빈 403을 돌려준다.
    # 프로필별 파일이 아니라 공통에 두는 이유: 로컬 기동도 기본 프로필(prod)로 돌아가고 있어
    # application-local.yml에 넣으면 적용되지 않는다.
    with-credentials: true
