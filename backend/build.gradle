plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'taedonghee'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('langgraph4jVersion', '1.8.25')
	set('langchain4jVersion', '1.0.0-beta1')
	set('junitVersion', '6.0.3')
}

configurations.all {
	resolutionStrategy.eachDependency { DependencyResolveDetails details ->
		if (details.requested.group == 'ch.qos.logback') {
			details.useVersion '1.5.34'
		}
		if (details.requested.group == 'com.fasterxml.jackson.core' && details.requested.name == 'jackson-annotations') {
			details.useVersion '2.21'
		}
		// langchain4j-bom이 JUnit 5.11.3을 끌어와 Spring Boot 4.1이 요구하는 6.0.3을 덮어쓴다.
		// spring-test 7의 SpringExtension은 JUnit 6 API로 컴파일돼 있어서, 5.11.3이 선택되면
		// @SpringBootTest가 전부 NoSuchMethodError(ExtensionContext$Store.computeIfAbsent)로 죽는다.
		if (details.requested.group in ['org.junit.jupiter', 'org.junit.platform']) {
			details.useVersion junitVersion
		}
	}
}

dependencyManagement {
	imports {
		mavenBom "dev.langchain4j:langchain4j-bom:${langchain4jVersion}"
		mavenBom "org.bsc.langgraph4j:langgraph4j-bom:${langgraph4jVersion}"
		// Keep the JDBC module and core aligned; langchain4j imports an older 1.x BOM.
		mavenBom 'org.testcontainers:testcontainers-bom:2.0.5'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	// LangGraph4j
	implementation 'org.bsc.langgraph4j:langgraph4j-core'
	implementation 'org.bsc.langgraph4j:langgraph4j-langchain4j'
	implementation 'org.bsc.langgraph4j:langgraph4j-postgres-saver'

	// LangChain4j (Gemini)
	implementation 'dev.langchain4j:langchain4j'
	implementation 'dev.langchain4j:langchain4j-google-ai-gemini'

	// AWS S3
	implementation 'software.amazon.awssdk:s3:2.29.35'
	// Add a WebP ImageIO reader so profile uploads can be decoded before storing.
	implementation 'com.twelvemonkeys.imageio:imageio-webp:3.15.2'

	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// Never inherit local/prod (and their shared database credentials) when running tests.
	systemProperty 'spring.profiles.active', 'test'
}
